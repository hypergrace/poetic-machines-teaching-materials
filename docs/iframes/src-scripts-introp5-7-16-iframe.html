<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>p5 Sketch</title>
    <style>body { margin:0; padding:0; overflow:hidden; }</style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  </head>
  <body>
  <script>
  let x = 250;
let y = 125;
let w = 125;
let h = 70;

function setup() {
  createCanvas(400, 400);
}

function draw() {
  background(220);
  

  let hover = false;
    
  if(mouseY>y && mouseY<y+h && mouseX>x && mouseX < x + w){
    hover = true;
  }
  else {
    hover = false;
  }
  
  
  
  // button functionality
  if(hover && mouseIsPressed){
    stroke("blue");
    fill("purple");
  }
  else if (hover){
    stroke("black")
    fill("green"); 
  }
  else {
    stroke("black");
    noFill();
  }
  
  rect(x,y,w,h);
  
    stroke("black");
  fill("white");
  circle(mouseX,mouseY,5);
  
  
}
  </script>
  </body>
  </html>
